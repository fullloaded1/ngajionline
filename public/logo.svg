<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E5EC"/>
      <stop offset="50%" stop-color="#A8B2C0"/>
      <stop offset="100%" stop-color="#7A8494"/>
    </linearGradient>
  </defs>

  <!-- Arch/Dome shape -->
  <path d="M100 10 L60 50 L50 120 L100 140 L150 120 L140 50 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M100 10 L85 50 L80 120 L100 140 L120 120 L115 50 Z" fill="url(#silverGrad)" opacity="0.85"/>

  <!-- Book base -->
  <path d="M50 130 Q100 115 150 130 L145 150 Q100 135 55 150 Z" fill="url(#goldGrad)"/>
  <path d="M100 115 L100 150" stroke="#C9A84C" stroke-width="2"/>

  <!-- Pen nib -->
  <path d="M130 80 L145 45 L150 65 Z" fill="url(#silverGrad)"/>
  <path d="M143 47 L148 60" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- Arabic calligraphy style text (simplified) -->
  <text x="100" y="185" font-family="serif" font-size="22" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">كـلام</text>
  <text x="100" y="205" font-family="sans-serif" font-size="11" font-weight="600" fill="#C9A84C" text-anchor="middle" letter-spacing="4">KALAAM</text>
</svg>
